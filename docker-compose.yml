services:
  frontend:
    build:
      context: ./frontend
    container_name: ai_finance_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: ai_finance_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: postgres:16
    container_name: ai_finance_migrate
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: finance_user
      PGPASSWORD: finance_password
      PGDATABASE: finance_db
    volumes:
      - ./database:/database:ro
    command: ["/bin/sh", "/database/run_migrations.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16
    container_name: ai_finance_db
    restart: always
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./database/seed_rules.sql:/docker-entrypoint-initdb.d/2-seed_rules.sql

volumes:
  postgres_data:
